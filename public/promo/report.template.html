<script>
const DATA=/*__DATA__*/;
const TABS=[{id:"macro",label:"Brands overview"},{id:"exec",label:"Summary"},{id:"money",label:"Bonus vs Deposits"},{id:"codes",label:"Codes"},{id:"bands",label:"Value bands"},{id:"config",label:"Recommended config"},{id:"ref",label:"Reference"}];
const GORDER=["Identity","COSTS / EARNS","DEPOSITS BACK","BONUS ROI over time","KEEPS PLAYERS","STICKINESS","LOYALTY","REVIEW","WHAT TO DO","CHECK"];

const g=id=>document.getElementById(id),d=()=>DATA[R],sym=()=>d().sym;
const esc=s=>String(s==null?"":s).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g,"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const M=n=>sym()+(Math.abs(n)>=1e7?(n/1e6).toFixed(0)+"M":Math.abs(n)>=1e6?(n/1e6).toFixed(1)+"M":n>=1000?Math.round(n).toLocaleString():Math.round(n));

const bandchip=b=>b?`<span class="bchip"><i style="background:var(--band-${String(b).toLowerCase().replace(/[^a-z]/g,'')})"></i>${esc(b)}</span>`:"";
/* ================= CODES ================= */
const CS={pillar:"All",q:"",sort:null,dir:1,view:"lean",open:null,cf:{},hidden:new Set(),vlane:"A",vopen:null};
const cellD=(c,key)=>{const x=c.cells[key];return x?x.d:"";};
const cnum=(c,k)=>{const x=c.cells[k];return x&&x.n!=null?x.n:null;};
const LEAN=[
 {id:"code",label:"Code",sticky:1,lock:1,get:c=>c.cells["Promo code"].d},
 {id:"call",label:"Call",kind:"cat",get:c=>c._call},
 {id:"pillar",label:"Pillar",kind:"cat",get:c=>c._pillar},
 {id:"type",label:"Type",kind:"cat",get:c=>c._type},
 {id:"spend",label:"Bonus",n:1,kind:"num",get:c=>c._spend},
 {id:"players",label:"Players",n:1,kind:"num",get:c=>c._players,disp:c=>c._players!=null?c._players.toLocaleString():"—"},
 // pillar-specific KEY judging metrics (shown only when that pillar is filtered)
 {id:"costftd",label:"Cost / new depositor",n:1,kind:"num",pillars:["Acquisition"],get:c=>cnum(c,"COSTS / EARNS · Cost / new depositor"),disp:c=>cellD(c,"COSTS / EARNS · Cost / new depositor")},
 {id:"conv",label:"Claimed→dep",kind:"cat",pillars:["Acquisition"],get:c=>cellD(c,"COSTS / EARNS · Claimed → deposited")},
 {id:"stick30",label:"Stick 30d",kind:"cat",pillars:["Acquisition"],get:c=>cellD(c,"STICKINESS · New players came back (30d)")},
 {id:"costret",label:"Cost/retained",n:1,kind:"num",pillars:["Retention"],get:c=>cnum(c,"COSTS / EARNS · Cost / retained"),disp:c=>cellD(c,"COSTS / EARNS · Cost / retained")},
 {id:"roi30",label:"Bonus ROI · 30d",n:1,kind:"num",pillars:["Retention","VIP"],get:c=>cnum(c,"BONUS ROI over time · 30d"),disp:c=>cellD(c,"BONUS ROI over time · 30d")},
 {id:"redup",label:"Redeposits vs tier",tip:"This code's 30-day redeposit rate minus the typical rate for the same membership tier + bonus type (broader groups when a tier sample is small), in percentage points. The redeposit signal the Retention / VIP decision is scored on. Observed — not a controlled test.",kind:"cat",pillars:["Retention","VIP"],get:c=>cellD(c,"KEEPS PLAYERS · Extra redeposits vs typical")},
 {id:"lifeval",label:"Lifetime NGR/player",n:1,kind:"num",pillars:["VIP"],get:c=>cnum(c,"LOYALTY · Lifetime NGR / player"),disp:c=>cellD(c,"LOYALTY · Lifetime NGR / player")},
 {id:"perrm",label:"Bonus ROI · 7d",n:1,kind:"num",get:c=>cnum(c,"BONUS ROI over time · 7d")},
 {id:"dep90",label:"Deposits back 90d",n:1,kind:"num",get:c=>cnum(c,"DEPOSITS BACK · 90d"),disp:c=>cellD(c,"DEPOSITS BACK · 90d")},
 {id:"band",label:"Band",kind:"cat",get:c=>c._band},
];
const LMAP=Object.fromEntries(LEAN.map(c=>[c.id,c]));
const leanCols=()=>LEAN.filter(c=>(c.lock||!CS.hidden.has(c.id))&&(!c.pillars||(CS.pillar!=="All"&&c.pillars.includes(CS.pillar))));
function codesFiltered(){
 let rows=d().codes.slice();
 if(CS.pillar!=="All")rows=rows.filter(c=>c._pillar===CS.pillar);
 if(CS.q){const q=CS.q.toLowerCase();rows=rows.filter(c=>(c.cells["Promo code"].d+" "+cellD(c,"WHAT TO DO · Why this call")+" "+cellD(c,"WHAT TO DO · The lever (mechanic + who to give it to)")).toLowerCase().includes(q));}
 for(const id in CS.cf){const f=CS.cf[id],col=LMAP[id];if(!col)continue;
  if(f.vals)rows=rows.filter(c=>f.vals.has(String(col.get(c)==null?'':col.get(c))));
  else if(f.min!=null||f.max!=null)rows=rows.filter(c=>{const v=col.get(c);return v!=null&&(f.min==null||v>=f.min)&&(f.max==null||v<=f.max);});
  else if(f.q)rows=rows.filter(c=>String(col.get(c)==null?'':col.get(c)).toLowerCase().includes(f.q.toLowerCase()));}
 if(CS.sort){
  if(CS.sort.slice(0,2)==="F:"){const key=CS.sort.slice(2);rows.sort((a,b)=>{const ca=a.cells[key],cb=b.cells[key];let x=ca?(ca.n!=null?ca.n:ca.d):null,y=cb?(cb.n!=null?cb.n:cb.d):null;if(x==null||x==="")return 1;if(y==null||y==="")return -1;if(typeof x==="number"&&typeof y==="number")return(x-y)*CS.dir;return String(x).localeCompare(String(y))*CS.dir;});}
  else{const col=LMAP[CS.sort];if(col)rows.sort((a,b)=>{let x=col.get(a),y=col.get(b);if(x==null)return 1;if(y==null)return -1;if(typeof x==="number"&&typeof y==="number")return(x-y)*CS.dir;return String(x).localeCompare(String(y))*CS.dir;});}
 }
 return rows;
}
function leanCell(c,col){
 if(col.id==="code")return `<span class="exp">${CS.open===c.cells["Promo code"].d?'▾':'▸'}</span>${esc(c.cells["Promo code"].d)}`;
 if(col.id==="call")return chip(c._call);
 if(col.id==="band")return bandchip(c._band);
 if(col.id==="spend")return money(c._spend);
 if(col.id==="perrm"||col.id==="roi30"){const v=col.get(c);return v==null?'<span class="mut">—</span>':`<span class="${v>0?'pos':v<0?'neg':''}">${v.toFixed(2)}</span>`;}
 if(col.disp){const v=col.disp(c);return v&&v!=="—"?esc(v):'<span class="mut">—</span>';}
 const v=col.get(c);return v==null||v===""?'<span class="mut">—</span>':esc(String(v));}
/* The KEEPS PLAYERS group shows TWO different redeposit comparisons that readers mix up — a per-cell
   tooltip + a group note spell out each benchmark (pillar+type vs tier+type) and that both are
   observational. Wording confirmed against keeps_horizon.py (came-back rate) and
   ret_report/02_compute_metrics.py (Extra redeposits vs typical = redeposit_uplift, tier×mechanic). */
const REDEP_TIP={
 extra:"This code's 30-day redeposit rate minus the typical rate for the SAME membership tier + bonus type (broader groups are used when a tier has too few players). Shown in percentage points. This is the redeposit figure the Retention / VIP Lane A decision is scored on. Observed over the window — not a controlled test.",
 came:"Share of matured claimers who deposited again within the window — any deposit, not only on this code. The (+N) is percentage points above the average for the SAME pillar + bonus type. Observed — not a controlled test."
};
const REDEP_NOTE="Two different comparisons, built from separate player groups: the (+N) beside a came-back % is vs the pillar + bonus-type average; “Extra redeposits vs typical” is vs the membership-tier + bonus-type benchmark. Separate populations — so the two numbers won't line up, and one can't be worked out from the other.";
function detailBody(c){
 const groups={};d().columns.forEach(col=>{if(col.group==="Identity")return;const cel=c.cells[col.key];if(!cel||cel.d===""||cel.d==="—")return;(groups[col.group]=groups[col.group]||[]).push([col.label,cel.d,col.key]);});
 let secs="";GORDER.forEach(gk=>{if(!groups[gk]||gk==="WHAT TO DO"||gk==="CHECK")return;const note=gk==="KEEPS PLAYERS"?`<div class="dnote">${esc(REDEP_NOTE)}</div>`:"";secs+=`<div class="dsec"><div class="dh">${esc(GLABEL[gk]||gk)}</div>${note}${groups[gk].map(([k,v,key])=>{const tip=gk==="KEEPS PLAYERS"?(/Extra redeposits/.test(key)?REDEP_TIP.extra:REDEP_TIP.came):"";return `<div class="dkv"${tip?` title="${esc(tip)}"`:""}><span class="k">${esc(k)}${tip?` <span class="info" title="${esc(tip)}">ⓘ</span>`:""}</span><span class="v">${esc(v)}</span></div>`;}).join("")}</div>`;});
 const why=cellD(c,"WHAT TO DO · Why this call"),lev=cellD(c,"WHAT TO DO · The lever (mechanic + who to give it to)"),who=cellD(c,"WHAT TO DO · Who claimed (actual segment)");
 return `<div class="dgrid"><div class="dwhy"><b>${esc(c._call)}</b> — ${esc(why)}${lev?`<br><b>Lever:</b> ${esc(lev)}`:""}${who?`<br><b>Reached:</b> ${esc(who)}`:""}</div>${c._pillar==="Acquisition"?repeatPerCode(c):""}${secs}</div>`;
}
/* ---- per-code Players drill-down (gated, server-backed; locked on the shared file) ---- */
const PCACHE={},PMAP={},PMAPLOAD={},PVDEF={q:"",tier:"all",src:"all",sort:"bonus",dir:-1,page:1,open:null,listOpen:false};
let PV=Object.assign({},PVDEF);const PPP=25;
const SRCLBL={deposit_match:"Deposit-match",fasttrack:"FastTrack",operator:"Operator",self:"Self"};
const SRCCLS={deposit_match:"dm",fasttrack:"ft",operator:"op",self:"sf"};
const playersApi=()=>((typeof window!=="undefined"&&window.__PLAYERS_API__)||new URLSearchParams(location.search).get("papi")||null);
const papiFor=()=>{const a=playersApi();return a?a.replace(/\{R\}/g,R):null;};
const combinedMode=()=>{const a=papiFor();return !!a&&/\.json(\?|$)/.test(a);};
const pkey=code=>R+"::"+code;
function loadPlayers(code){
 const k=pkey(code);
 if(combinedMode()){
  if(PMAP[R]){PCACHE[k]=PMAP[R][code]||[];return;}
  PCACHE[k]="loading";
  if(!PMAPLOAD[R])PMAPLOAD[R]=fetch(papiFor()).then(r=>{if(!r.ok)throw 0;return r.json();}).then(m=>{PMAP[R]=m;});
  PMAPLOAD[R].then(()=>{PCACHE[k]=(PMAP[R]&&PMAP[R][code])||[];if(CS.open===code&&CS.dtab==="players")renderCodes();}).catch(()=>{PCACHE[k]="error";if(CS.open===code&&CS.dtab==="players")renderCodes();});
  return;
 }
 PCACHE[k]="loading";
 fetch(papiFor().replace(/\/$/,"")+"/"+R+"/"+encodeURIComponent(code)+".json").then(r=>{if(!r.ok)throw 0;return r.json();}).then(j=>{PCACHE[k]=Array.isArray(j)?j:(j.players||[]);if(CS.open===code&&CS.dtab==="players")renderCodes();}).catch(()=>{PCACHE[k]="error";if(CS.open===code&&CS.dtab==="players")renderCodes();});
}
const pcount=code=>{const s=PCACHE[pkey(code)];return Array.isArray(s)?s.length:null;};
const pfmt=n=>n==null?'<span class="mut">—</span>':(n<0?'<span class="neg">−'+sym()+Math.round(-n).toLocaleString()+'</span>':sym()+Math.round(n).toLocaleString());
function pFilterSort(rows){
