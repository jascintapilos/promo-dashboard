<script>
const DATA=/*__DATA__*/;
const TABS=[{id:"exec",label:"Executive overview"},{id:"money",label:"Bonus vs Deposits"},{id:"codes",label:"Codes"},{id:"bands",label:"Value bands"},{id:"config",label:"Recommended config"},{id:"ref",label:"Reference"}];
const GORDER=["Identity","COSTS / EARNS","DEPOSITS BACK","BONUS ROI over time","KEEPS PLAYERS","STICKINESS","LOYALTY","REVIEW","WHAT TO DO","CHECK"];
const GLABEL={"DEPOSITS BACK":"DEPOSITS BACK (gross · not profit)","KEEPS PLAYERS":"CAME BACK (share who redeposited)"};
const FUN=`<svg width="10" height="10" viewBox="0 0 10 10"><path d="M0.6 1.4h8.8L6 5.2V8L4 9V5.2z" fill="currentColor"/></svg>`;
let R="MY",TAB="exec",MW="30d",CT="Retention",VB="risk";const WINS=["7d","30d","90d"];
const winSwitch=()=>`<span class="winsw">${WINS.map(w=>`<button data-w="${w}" class="${w===MW?'on':''}">${w}</button>`).join("")}</span>`;
const g=id=>document.getElementById(id),d=()=>DATA[R],sym=()=>d().sym;
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const M=n=>sym()+(Math.abs(n)>=1e7?(n/1e6).toFixed(0)+"M":Math.abs(n)>=1e6?(n/1e6).toFixed(1)+"M":n>=1000?Math.round(n).toLocaleString():Math.round(n));
const money=n=>sym()+Math.round(n).toLocaleString();
const chip=v=>v?`<span class="chip c-${String(v).toLowerCase().replace(/[^a-z]/g,'')}">${esc(v)}</span>`:"";
const bandchip=b=>b?`<span class="bchip"><i style="background:var(--band-${b.toLowerCase()})"></i>${esc(b)}</span>`:"";
/* ================= CODES ================= */
const CS={pillar:"All",q:"",sort:null,dir:1,view:"lean",open:null,cf:{},hidden:new Set()};
const cellD=(c,key)=>{const x=c.cells[key];return x?x.d:"";};
const cnum=(c,k)=>{const x=c.cells[k];return x&&x.n!=null?x.n:null;};
const LEAN=[
 {id:"code",label:"Code",sticky:1,get:c=>c.cells["Promo code"].d},
 {id:"call",label:"Call",kind:"cat",get:c=>c._call},
 {id:"pillar",label:"Pillar",kind:"cat",get:c=>c._pillar},
 {id:"type",label:"Type",kind:"cat",get:c=>c._type},
 {id:"spend",label:"Bonus",n:1,kind:"num",get:c=>c._spend},
 // pillar-specific KEY judging metrics (shown only when that pillar is filtered)
 {id:"costftd",label:"Cost/FTD",n:1,kind:"num",pillars:["Acquisition"],get:c=>cnum(c,"COSTS / EARNS · Cost / new depositor"),disp:c=>cellD(c,"COSTS / EARNS · Cost / new depositor")},
 {id:"conv",label:"Claimed→dep",kind:"cat",pillars:["Acquisition"],get:c=>cellD(c,"COSTS / EARNS · Claimed → deposited")},
 {id:"stick30",label:"Stick 30d",kind:"cat",pillars:["Acquisition"],get:c=>cellD(c,"STICKINESS · New players came back (30d)")},
 {id:"costret",label:"Cost/retained",n:1,kind:"num",pillars:["Retention"],get:c=>cnum(c,"COSTS / EARNS · Cost / retained"),disp:c=>cellD(c,"COSTS / EARNS · Cost / retained")},
 {id:"roi30",label:"Bonus ROI · 30d",n:1,kind:"num",pillars:["Retention","VIP"],get:c=>cnum(c,"BONUS ROI over time · 30d"),disp:c=>cellD(c,"BONUS ROI over time · 30d")},
 {id:"redup",label:"Redeposits vs baseline",kind:"cat",pillars:["Retention","VIP"],get:c=>cellD(c,"KEEPS PLAYERS · Extra redeposits vs typical")},
 {id:"lifeval",label:"Lifetime NGR/player",n:1,kind:"num",pillars:["VIP"],get:c=>cnum(c,"LOYALTY · Lifetime NGR / player"),disp:c=>cellD(c,"LOYALTY · Lifetime NGR / player")},
 {id:"perrm",label:"Bonus ROI · 7d",n:1,kind:"num",get:c=>c._perrm},
 {id:"dep90",label:"Deposits back 90d",n:1,kind:"num",get:c=>cnum(c,"DEPOSITS BACK · 90d"),disp:c=>cellD(c,"DEPOSITS BACK · 90d")},
 {id:"band",label:"Band",kind:"cat",get:c=>c._band},
];
const LMAP=Object.fromEntries(LEAN.map(c=>[c.id,c]));
const leanCols=()=>LEAN.filter(c=>!CS.hidden.has(c.id)&&(!c.pillars||(CS.pillar!=="All"&&c.pillars.includes(CS.pillar))));
function codesFiltered(){
 let rows=d().codes.slice();
 if(CS.pillar!=="All")rows=rows.filter(c=>c._pillar===CS.pillar);
 if(CS.q){const q=CS.q.toLowerCase();rows=rows.filter(c=>(c.cells["Promo code"].d+" "+cellD(c,"WHAT TO DO · Why this call")+" "+cellD(c,"WHAT TO DO · The lever (mechanic + who to give it to)")).toLowerCase().includes(q));}
 for(const id in CS.cf){const f=CS.cf[id],col=LMAP[id];if(!col)continue;
  if(f.vals)rows=rows.filter(c=>f.vals.has(String(col.get(c)==null?'':col.get(c))));
  else if(f.min!=null||f.max!=null)rows=rows.filter(c=>{const v=col.get(c);return v!=null&&(f.min==null||v>=f.min)&&(f.max==null||v<=f.max);});
  else if(f.q)rows=rows.filter(c=>String(col.get(c)==null?'':col.get(c)).toLowerCase().includes(f.q.toLowerCase()));}
 if(CS.sort){
  if(CS.sort.slice(0,2)==="F:"){const key=CS.sort.slice(2);rows.sort((a,b)=>{const ca=a.cells[key],cb=b.cells[key];let x=ca?(ca.n!=null?ca.n:ca.d):null,y=cb?(cb.n!=null?cb.n:cb.d):null;if(x==null||x==="")return 1;if(y==null||y==="")return -1;if(typeof x==="number"&&typeof y==="number")return(x-y)*CS.dir;return String(x).localeCompare(String(y))*CS.dir;});}
  else{const col=LMAP[CS.sort];if(col)rows.sort((a,b)=>{let x=col.get(a),y=col.get(b);if(x==null)return 1;if(y==null)return -1;if(typeof x==="number"&&typeof y==="number")return(x-y)*CS.dir;return String(x).localeCompare(String(y))*CS.dir;});}
 }
 return rows;
}
function leanCell(c,col){
 if(col.id==="code")return `<span class="exp">${CS.open===c.cells["Promo code"].d?'▾':'▸'}</span>${esc(c.cells["Promo code"].d)}`;
 if(col.id==="call")return chip(c._call);
 if(col.id==="band")return bandchip(c._band);
 if(col.id==="spend")return money(c._spend);
 if(col.id==="perrm"||col.id==="roi30"){const v=col.get(c);return v==null?'<span class="mut">—</span>':`<span class="${v>0?'pos':v<0?'neg':''}">${v.toFixed(2)}</span>`;}
 if(col.disp){const v=col.disp(c);return v&&v!=="—"?esc(v):'<span class="mut">—</span>';}
 const v=col.get(c);return v==null||v===""?'<span class="mut">—</span>':esc(String(v));}
function detailBody(c){
 const groups={};d().columns.forEach(col=>{if(col.group==="Identity")return;const cel=c.cells[col.key];if(!cel||cel.d===""||cel.d==="—")return;(groups[col.group]=groups[col.group]||[]).push([col.label,cel.d]);});
 let secs="";GORDER.forEach(gk=>{if(!groups[gk]||gk==="WHAT TO DO"||gk==="CHECK")return;secs+=`<div class="dsec"><div class="dh">${esc(GLABEL[gk]||gk)}</div>${groups[gk].map(([k,v])=>`<div class="dkv"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join("")}</div>`;});
 const why=cellD(c,"WHAT TO DO · Why this call"),lev=cellD(c,"WHAT TO DO · The lever (mechanic + who to give it to)"),who=cellD(c,"WHAT TO DO · Who claimed (actual segment)");
 return `<div class="dgrid"><div class="dwhy"><b>${esc(c._call)}</b> — ${esc(why)}${lev?`<br><b>Lever:</b> ${esc(lev)}`:""}${who?`<br><b>Reached:</b> ${esc(who)}`:""}</div>${secs}</div>`;
}
/* ---- per-code Players drill-down (gated, server-backed; locked on the shared file) ---- */
const PCACHE={},PMAP={},PMAPLOAD={},PVDEF={q:"",tier:"all",src:"all",sort:"bonus",dir:-1,page:1,open:null};
let PV=Object.assign({},PVDEF);const PPP=25;
const SRCLBL={deposit_match:"Deposit-match",fasttrack:"FastTrack",operator:"Operator",self:"Self"};
const SRCCLS={deposit_match:"dm",fasttrack:"ft",operator:"op",self:"sf"};
const playersApi=()=>((typeof window!=="undefined"&&window.__PLAYERS_API__)||new URLSearchParams(location.search).get("papi")||null);
const papiFor=()=>{const a=playersApi();return a?a.replace(/\{R\}/g,R):null;};
const combinedMode=()=>{const a=papiFor();return !!a&&/\.json(\?|$)/.test(a);};
const pkey=code=>R+"::"+code;
function loadPlayers(code){
 const k=pkey(code);
 if(combinedMode()){
  if(PMAP[R]){PCACHE[k]=PMAP[R][code]||[];return;}
  PCACHE[k]="loading";
  if(!PMAPLOAD[R])PMAPLOAD[R]=fetch(papiFor()).then(r=>{if(!r.ok)throw 0;return r.json();}).then(m=>{PMAP[R]=m;});
  PMAPLOAD[R].then(()=>{PCACHE[k]=(PMAP[R]&&PMAP[R][code])||[];if(CS.open===code&&CS.dtab==="players")renderCodes();}).catch(()=>{PCACHE[k]="error";if(CS.open===code&&CS.dtab==="players")renderCodes();});
  return;
 }
 PCACHE[k]="loading";
 fetch(papiFor().replace(/\/$/,"")+"/"+R+"/"+encodeURIComponent(code)+".json").then(r=>{if(!r.ok)throw 0;return r.json();}).then(j=>{PCACHE[k]=Array.isArray(j)?j:(j.players||[]);if(CS.open===code&&CS.dtab==="players")renderCodes();}).catch(()=>{PCACHE[k]="error";if(CS.open===code&&CS.dtab==="players")renderCodes();});
}
const pcount=code=>{const s=PCACHE[pkey(code)];return Array.isArray(s)?s.length:null;};
const pfmt=n=>n==null?'<span class="mut">—</span>':(n<0?'<span class="neg">−'+sym()+Math.round(-n).toLocaleString()+'</span>':sym()+Math.round(n).toLocaleString());
function pFilterSort(rows){
 let r=rows.slice();const q=PV.q.toLowerCase();
 if(q)r=r.filter(x=>String(x.username||x.member_id).toLowerCase().includes(q));
 if(PV.tier==="vip")r=r.filter(x=>x.is_vip);else if(PV.tier==="non")r=r.filter(x=>!x.is_vip);
 if(PV.src!=="all")r=r.filter(x=>x.source===PV.src);
 const key=PV.sort;r.sort((a,b)=>{if(key==="user")return String(a.username||a.member_id).localeCompare(String(b.username||b.member_id))*PV.dir;const av=a[key]==null?-Infinity:a[key],bv=b[key]==null?-Infinity:b[key];return(av-bv)*PV.dir;});
 return r;
}
function playerExpand(x){
 const sb=x.source_breakdown?Object.entries(x.source_breakdown).map(([k,v])=>`${SRCLBL[k]||k} ${v}`).join(" · "):"";
 const kv=[["Member ID",esc(x.member_id)],["Tenure",x.tenure_days!=null?x.tenure_days+" days":"—"],["Source split",sb||"—"],["Flags",(x.flags||[]).join(", ")||"—"],["Bonus received",money(x.bonus)],["Deposit to unlock",x.dep_to_unlock?money(x.dep_to_unlock):"—"],["Deposit after claim",x.dep_after?money(x.dep_after):"—"],["NGR (window)",x.ngr==null?"—":(x.ngr<0?"−"+money(-x.ngr):money(x.ngr))]];
 return `<div class="pexpg">${kv.map(([k,v])=>`<div class="dkv"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("")}<div class="ptl">Timeline (claims &amp; deposits over time) — coming with the gated build.</div></div>`;
}
function playersTable(rows,code){
 const filt=pFilterSort(rows),tot=filt.length,pages=Math.max(1,Math.ceil(tot/PPP));
 if(PV.page>pages)PV.page=pages;const a=(PV.page-1)*PPP,pg=filt.slice(a,a+PPP);
 const th=(k,l,n)=>`<th class="${n?'n':''}" data-psort="${k}">${l}${PV.sort===k?`<span class="sarrow">${PV.dir>0?'▲':'▼'}</span>`:""}</th>`;
 const srcs=[...new Set(rows.map(x=>x.source))];
 const bar=`<div class="pbar"><input class="pq" placeholder="search username…" value="${esc(PV.q)}"><span class="pchips"><button data-pt="all" class="${PV.tier==='all'?'on':''}">All</button><button data-pt="vip" class="${PV.tier==='vip'?'on':''}">VIP</button><button data-pt="non" class="${PV.tier==='non'?'on':''}">Non-VIP</button></span>${srcs.length>1?`<select class="psrc"><option value="all">All sources</option>${srcs.map(s=>`<option value="${s}" ${PV.src===s?'selected':''}>${SRCLBL[s]||s}</option>`).join("")}</select>`:""}<span class="pcount">${tot.toLocaleString()} players · ${tot?a+1:0}–${Math.min(a+PPP,tot)}</span></div>`;
 const body=pg.map(x=>{const nm=esc(x.username||x.member_id),op=PV.open===x.member_id,fl=(x.flags||[]).includes("uncovered")?'<span class="udot" title="uncovered"></span>':"",src=`<span class="psrc-b ${SRCCLS[x.source]||''}">${SRCLBL[x.source]||esc(x.source||'—')}</span>`;
  return `<tr class="prow" data-pm="${esc(x.member_id)}"><td class="user">${nm}</td><td>${x.tier?`<span class="ptier${x.is_vip?' vip':''}">${esc(x.tier)}</span>`:'—'}</td><td class="n">${x.claims}</td><td class="n">${money(x.bonus)}</td><td class="n">${pfmt(x.dep_to_unlock)}</td><td class="n">${pfmt(x.dep_after)}</td><td class="n">${pfmt(x.ngr)}${fl}</td><td>${src}</td></tr>${op?`<tr class="pexp"><td colspan="8">${playerExpand(x)}</td></tr>`:""}`;}).join("");
 const pager=pages>1?`<div class="ppager"><button class="pprev" ${PV.page<=1?'disabled':''}>‹</button><span>${PV.page} / ${pages}</span><button class="pnext" ${PV.page>=pages?'disabled':''}>›</button></div>`:"";
 return `<div class="ppane">${bar}<div class="tblwrap"><table class="d lean ptbl"><thead><tr class="leaf">${th("user","Username")}${th("tier","Tier")}${th("claims","Claims",1)}${th("bonus","Bonus",1)}${th("dep_to_unlock","To unlock",1)}${th("dep_after","After claim",1)}${th("ngr","NGR",1)}<th>Source</th></tr></thead><tbody>${body||`<tr><td colspan="8" class="mut" style="padding:14px">No players match.</td></tr>`}</tbody></table></div>${pager}<div class="foot"><span class="udot"></span> uncovered · <b>To unlock / After claim</b> = deposit before vs after the claim (same basis as Bonus vs Deposits). Observed; given ≠ abuse. <span class="pll">🔒 signed-in view · usernames · not in the shared file</span></div></div>`;
}
function playersPane(c){
 const code=c.cells["Promo code"].d;
 if(!playersApi())return `<div class="plock">🔒 The player list opens in the <b>signed-in</b> version of this report. No player data is included in the shared file.</div>`;
 const s=PCACHE[pkey(code)];
 if(s===undefined){loadPlayers(code);return `<div class="pload">Loading players…</div>`;}
 if(s==="loading")return `<div class="pload">Loading players…</div>`;
 if(s==="error")return `<div class="perr">Couldn't load the player list. <button class="pretry">Retry</button></div>`;
 return playersTable(s,code);
}
function detailHTML(c){
 const code=c.cells["Promo code"].d,dt=CS.dtab||"detail",pc=pcount(code);
 return `<div class="dwrap"><div class="dtabs"><button class="dtab ${dt==='detail'?'on':''}" data-dtab="detail">Detail</button><button class="dtab ${dt==='players'?'on':''}" data-dtab="players">Players${pc!=null?` <span class="cnt">${pc.toLocaleString()}</span>`:""}</button></div><div class="dbody">${dt==="players"?playersPane(c):detailBody(c)}</div></div>`;
}
function fullCols(){return d().columns.filter(c=>c.group!=="CHECK"&&(c.group==="Identity"||CS.pillar==="All"||c.pillars.includes(CS.pillar))).slice().sort((a,b)=>GORDER.indexOf(a.group)-GORDER.indexOf(b.group));}
function renderCodes(){
 const rows=codesFiltered();
 const nf=Object.keys(CS.cf).length;
 const fbar=`<div class="fbar">
   <div class="seg" id="pillsub">${["All","Acquisition","Retention","VIP"].map(p=>`<button data-p="${p}" class="${p===CS.pillar?'on':''}">${p}</button>`).join("")}</div>
   <input type="text" id="cq" placeholder="search code / why / lever…" value="${esc(CS.q)}">
   <button class="btn" id="colbtn">⊞ Columns</button>
   <button class="btn ${CS.view==='full'?'on':''}" id="vtog">Full grid</button>
   <button class="btn" id="cclr">⊘ Clear filters${nf?` (${nf})`:""}</button>
   <span class="rc">${rows.length} of ${d().codes.length} codes</span></div>`;
 let tbl;
 if(CS.view==="lean"){
  const cols=leanCols();
  const keyN=cols.filter(col=>col.pillars).length;
  tbl=`<div class="tblwrap"><table class="d lean"><thead><tr class="leaf">${cols.map(col=>`<th class="${col.n?'n':''}${col.sticky?' stick':''}${col.pillars?' keycol':''}"><span class="lab" data-sort="${col.id}">${esc(col.label)}${CS.sort===col.id?`<span class="sarrow">${CS.dir>0?'▲':'▼'}</span>`:""}</span>${col.kind?`<span class="fun${CS.cf[col.id]?' act':''}" data-fcol="${col.id}" title="Filter">${FUN}</span>`:""}</th>`).join("")}</tr></thead><tbody>
   ${rows.map(c=>{const code=c.cells["Promo code"].d,open=CS.open===code;return `<tr class="crow" data-code="${esc(code)}">${cols.map(col=>`<td class="${col.n?'n':''}${col.sticky?' stick':''}${col.pillars?' keycol':''}">${leanCell(c,col)}</td>`).join("")}</tr>${open?`<tr class="detail"><td colspan="${cols.length}">${detailHTML(c)}</td></tr>`:""}`;}).join("")}
   </tbody></table></div><div class="foot">Click a row for the full per-code detail · funnel icon on a header = filter that column.${keyN?` <span style="color:var(--accent)">Shaded columns</span> = the key metric${keyN>1?'s':''} ${CS.pillar} is judged on.`:` Filter to a pillar (Acquisition / Retention / VIP) to surface its key judging metrics — shaded.`}</div>`;
 }else{
  const cols=fullCols().filter(c=>!CS.hidden.has(c.key));
  const groups=[];cols.forEach(c=>{const l=groups[groups.length-1];if(l&&l.g===c.group)l.n++;else groups.push({g:c.group,n:1});});
  tbl=`<div class="tblwrap"><table class="d"><thead>
    <tr>${groups.map(gr=>`<th class="grp${gr.g==='Identity'?' stick':''}" colspan="${gr.n}">${gr.g==='Identity'?'':esc(GLABEL[gr.g]||gr.g)}</th>`).join("")}</tr>
    <tr class="leaf">${cols.map(c=>`<th class="${c.type==='cur'||c.type==='num'||c.type==='pct'?'n':''}${c.key==='Promo code'?' stick':''}"><span class="lab" data-fsort="${esc(c.key)}">${esc(c.label)}${CS.sort==="F:"+c.key?`<span class="sarrow">${CS.dir>0?'▲':'▼'}</span>`:""}</span></th>`).join("")}</tr></thead><tbody>
    ${rows.map(c=>`<tr>${cols.map(col=>{const cel=c.cells[col.key];const cls=(col.type==='cur'||col.type==='num'||col.type==='pct'?'n':'')+(col.key==='Promo code'?' stick':'');return `<td class="${cls}">${cel&&cel.d!==""&&cel.d!=="—"?(col.type==='chip'?chip(cel.d):esc(cel.d)):'<span class="mut">—</span>'}</td>`;}).join("")}</tr>`).join("")}
    </tbody></table></div>`;
 }
 g("panel").innerHTML=takeCodes(rows)+`<div class="card">${fbar}${tbl}</div>`;
 wireCodes();
}
function wireCodes(){
 g("pillsub").querySelectorAll("button").forEach(b=>b.onclick=()=>{CS.pillar=b.dataset.p;CS.open=null;closePop();renderCodes();});
 g("cq").oninput=e=>{CS.q=e.target.value;clearTimeout(window._t);window._t=setTimeout(renderCodes,180);};
 g("vtog").onclick=()=>{CS.view=CS.view==="lean"?"full":"lean";CS.open=null;CS.sort=null;closePop();renderCodes();};
 g("cclr").onclick=()=>{CS.cf={};CS.q="";renderCodes();};
 g("colbtn").onclick=e=>{e.stopPropagation();openColMenu(e.currentTarget);};
 document.querySelectorAll("table.lean .lab[data-sort]").forEach(s=>s.onclick=()=>{const k=s.dataset.sort;if(CS.sort===k)CS.dir*=-1;else{CS.sort=k;CS.dir=k==="code"?1:-1;}renderCodes();});
 document.querySelectorAll("table.d:not(.lean) .lab[data-fsort]").forEach(s=>s.onclick=()=>{const k="F:"+s.dataset.fsort;if(CS.sort===k)CS.dir*=-1;else{CS.sort=k;CS.dir=-1;}renderCodes();});
 document.querySelectorAll(".fun[data-fcol]").forEach(f=>f.onclick=e=>{e.stopPropagation();openFilter(f.dataset.fcol,f);});
 if(CS.view==="lean")document.querySelectorAll("tr.crow").forEach(tr=>tr.onclick=()=>{const c=tr.dataset.code;const opening=CS.open!==c;CS.open=opening?c:null;if(opening)PV=Object.assign({},PVDEF);renderCodes();});
 document.querySelectorAll(".dtab").forEach(b=>b.onclick=e=>{e.stopPropagation();CS.dtab=b.dataset.dtab;renderCodes();});
 const pq=document.querySelector(".ppane .pq");if(pq)pq.oninput=e=>{PV.q=e.target.value;PV.page=1;clearTimeout(window._pt);window._pt=setTimeout(()=>{renderCodes();const el=document.querySelector(".ppane .pq");if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}},180);};
 document.querySelectorAll(".pchips button").forEach(b=>b.onclick=()=>{PV.tier=b.dataset.pt;PV.page=1;renderCodes();});
 const psel=document.querySelector(".ppane .psrc");if(psel)psel.onchange=()=>{PV.src=psel.value;PV.page=1;renderCodes();};
 document.querySelectorAll(".ptbl th[data-psort]").forEach(h=>h.onclick=()=>{const k=h.dataset.psort;if(PV.sort===k)PV.dir*=-1;else{PV.sort=k;PV.dir=k==="user"?1:-1;}renderCodes();});
 document.querySelectorAll(".prow").forEach(tr=>tr.onclick=()=>{const m=tr.dataset.pm;PV.open=PV.open===m?null:m;renderCodes();});
 {const pp=document.querySelector(".pprev"),pn=document.querySelector(".pnext");if(pp)pp.onclick=()=>{if(PV.page>1){PV.page--;renderCodes();}};if(pn)pn.onclick=()=>{PV.page++;renderCodes();};}
 const prt=document.querySelector(".pretry");if(prt)prt.onclick=()=>{delete PCACHE[pkey(CS.open)];renderCodes();};
}
/* filter popover */
function closePop(){const p=g("pop");if(p)p.remove();document.removeEventListener("mousedown",outside);}
function outside(e){if(!e.target.closest("#pop")&&!e.target.closest(".fun")&&!e.target.closest("#colbtn"))closePop();}

function donutSVG(slices,total,ctr,sub){

   const p=(rad,a)=>[(cx+rad*Math.cos(a)).toFixed(2),(cy+rad*Math.sin(a)).toFixed(2)];
   const[ox0,oy0]=p(R,a0),[ox1,oy1]=p(R,a1),[ix1,iy1]=p(r,a1),[ix0,iy0]=p(r,a0);
   return `<path d="M${ox0} ${oy0} A${R} ${R} 0 ${lg} 1 ${ox1} ${oy1} L${ix1} ${iy1} A${r} ${r} 0 ${lg} 0 ${ix0} ${iy0} Z" fill="${s.color}" stroke="var(--surface)" stroke-width="2"><title>${esc(s.label)}: ${Math.round(f*100)}%</title></path>`;
 }).join("");
 return `<svg viewBox="0 0 200 200" width="176" height="176" role="img" aria-label="allocation donut">${arcs}<text x="100" y="97" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="16" fill="var(--ink)">${ctr}</text><text x="100" y="114" text-anchor="middle" font-size="9" fill="var(--muted)">${sub}</text></svg>`;
}

   const cells=meds.map((v,i)=>{let p=null;for(let j=i-1;j>=0;j--){if(meds[j]!=null){p=meds[j];break;}}const ar=(p!=null&&v!=null&&v!==p)?` <span class="mut">${v<p?'▾':'▴'}</span>`:'';return `<td class="n">${v==null?'<span class="mut">—</span>':money(v)}${ar}</td>`;}).join("");
   // weakly-decreasing across present cells (null-safe vs last-seen) AND ends below start
   let last=null,mono=true,seen=0;meds.forEach(v=>{if(v==null)return;seen++;if(last!=null&&v>last)mono=false;last=v;});
   const nn=meds.filter(v=>v!=null),drop=nn.length>=2&&nn[nn.length-1]<nn[0],clean=seen>=3&&mono&&drop;
   (clean?lower:uneven).push(vlbl(b));
   const flag=clean?'<span style="color:var(--bad)">lower at later stages</span>':'<span class="mut">uneven across stages</span>';
   return `<tr><td class="stick"><span class="dot" style="background:var(--band-${b.toLowerCase()})"></span>${vlbl(b)}</td>${cells}<td style="font-size:11px">${flag}</td></tr>`;
 }).join("");
 const jn=a=>a.length<3?a.join(" & "):a.slice(0,-1).join(", ")+" & "+a[a.length-1];
 const verb=a=>a.length>1?"show":"shows",movev=a=>a.length>1?"move":"moves";
 const foot=`Median YTD deposit of the members in each cell. ${lower.length?jn(lower)+" "+verb(lower)+" lower median deposits at later lifecycle stages"+(uneven.length?"; ":". "):""}${uneven.length?jn(uneven)+" "+movev(uneven)+" unevenly across stages (likely thin later-stage cells). ":""}Cross-sectional — different members in each cell, not the same members tracked over time.`;
 return `<div class="card"><div class="ct">Median deposit by lifecycle stage — value intensity <span class="basis">median YTD deposit per cell</span></div><div class="tblwrap"><table class="d"><thead><tr><th class="stick">Band</th>${st.map(s=>`<th class="n">${s}</th>`).join("")}<th>Read</th></tr></thead><tbody>${rows}</tbody></table></div><div class="foot">${foot}</div></div>`;
}

   ${m.cascade.map(row=>`<tr><td class="stick">${row.from}</td>${st.map(s=>`<td class="n ${s==="Active"?"pos":s==="Dormant"?"neg":""}">${row.pct[s]}%</td>`).join("")}<td class="n mut">${row.base.toLocaleString()}</td></tr>`).join("")}
 </tbody></table></div>`;
 const rb=m.react.byBand.filter(r=>r.pool>0);

   ${rb.map(r=>`<tr><td class="stick"><span class="dot" style="background:var(--band-${r.band.toLowerCase()})"></span>${vlbl(r.band)}</td><td class="n">${r.pool.toLocaleString()}</td><td class="n">${r.returned.toLocaleString()} (${r.retPct}%)</td><td class="n ${r.ngr<0?'neg':'pos'}">${MM(r.ngr)}</td></tr>`).join("")}
 </tbody></table></div>`;
 const cd=(m.cascade.find(r=>r.from==="Cooling")||{pct:{}}).pct.Dormant,wh=rb.find(r=>r.band==="Whale")||{},lo=rb.find(r=>r.band==="Low")||{};
 return `<div class="card"><div class="ct">How the base actually moved over ${m.horizon} days <span class="basis">measured flow · ${m.tThen} → ${m.tNow} · ${m.cohort.toLocaleString()} depositors tracked</span></div>
   <div style="padding:8px 14px 0"><div style="font:600 11px 'IBM Plex Sans';color:var(--muted);margin-bottom:4px">The slide — where each group ended up (green = stayed active · red = went dormant)</div>${cas}
   <div class="foot">Read across a row: of players <b>Cooling</b> ${m.horizon} days ago, <b>${cd}% went fully dormant</b>. Once someone starts cooling, most go quiet within the quarter — so <b>Cooling is the moment to act</b>, not Lapsed. High-value (Top-value + High): <b>${m.hv.worsePct}%</b> slid to a quieter state, but value is sticky (<b>${m.drift.samePct}%</b> of everyone kept their band) — so the at-risk money is players <b>going quiet</b>, not value collapsing.</div></div>
   <div style="padding:2px 14px 0"><div style="font:600 11px 'IBM Plex Sans';color:var(--muted);margin-bottom:4px">Win-back — who came back after going quiet</div>${rea}
   <div class="foot"><b>Win-back pays off at the top:</b> ${wh.retPct}% of quiet <b>whales</b> came back (${MM(wh.ngr)} of NGR), but <b>Low</b>-band returners come back <b>negative</b> (${MM(lo.ngr)}) — chasing them costs more than they bring. Aim win-back at Top-value/High; service Low cheaply. Most returners come back in the 8–60 day window (${m.react.speed["8-30"]}% + ${m.react.speed["31-60"]}%). <b>Observed flow, not causal</b> — recovered NGR is natural self-return, not proven promo lift; a holdout is the proof step.</div></div></div>`;

// who's in each band — tier & trial mix (from d().trialBand); reinforces "deposit band beats tier"

   <div style="padding:8px 14px 0"><div class="tblwrap"><table class="d cmpct"><thead><tr><th class="stick">Band</th><th class="n">Players</th><th style="min-width:150px">Composition</th><th class="n">Classic</th><th class="n">Bronze</th><th class="n">VIP-Trial</th><th class="n">VIP-Full</th></tr></thead><tbody>
   ${t.bands.map(b=>`<tr><td class="stick"><span class="dot" style="background:var(--band-${b.band.toLowerCase()})"></span>${vlbl(b.band)}</td><td class="n">${b.total.toLocaleString()}</td><td>${bar(b.segs,b.total)}</td>${order.map(s=>`<td class="n">${b.total?Math.round(b.segs[s]/b.total*100):0}%</td>`).join("")}</tr>`).join("")}

function tConfig(){
 const c=d().config,rows=d().configFull||[];
 const DEPBAND=/^By deposit band|^By first-deposit band/,HDR=/Turnover \(TO\)|Min-deposit|Eligible games|Match %|Bonus size|Cost \/|Sticks|Best welcome|Direction ·|Players' dominant/;
 const rowHTML=r=>{const filled=r.filter(x=>x).length;
   if(filled<=1){const t=r.find(x=>x)||"";const note=t.length>72;return `<tr><td colspan="7" class="${note?'cfgnote':'cfgband'}">${esc(t)}</td></tr>`;}
   const ish=r.some(x=>HDR.test(x));
   return `<tr class="${ish?'cfghd':''}">${r.map((x,i)=>`<td${i===0?' class="cfgk"':''}>${x?esc(x):''}</td>`).join("")}</tr>`;};
 // Only the 6 TRUE top-level banners start a new section. Tighter than SEC so the
 // Game-details sub-headers ("Retention · Free-credit", "VIP · Deposit"…) and notes
 // ("VIP deposit-match pays ONLY on whales…") stay inside their parent, not new tabs.
 const TOP=[{re:/^Retention.*Bonus ROI/,id:"Retention",short:"Retention"},
            {re:/^VIP.*extra/,id:"VIP",short:"VIP"},
            {re:/^Acquisition.*cost per new/,id:"Acquisition",short:"Acquisition"},
            {re:/^Game details by segment/,id:"games",short:"Game details"},
            {re:/^Budget/,id:"budget",short:"Budget & exposure"},
            {re:/^Eligible games/,id:"eligible",short:"Eligible games"}];
 const groups=[];let g0=null;
 rows.forEach(r=>{const filled=r.filter(x=>x).length,t=(r.find(x=>x)||"");
   const hit=filled<=1?TOP.find(s=>s.re.test(t)):null;
   if(hit){g0={title:t,id:hit.id,short:hit.short,rows:[]};groups.push(g0);}
   else if(g0)g0.rows.push(r); else {g0={title:"Config",id:"Config",short:"Config",rows:[r]};groups.push(g0);}});
 const pillars=["Retention","VIP","Acquisition"],dep=[],tabs=[];
 groups.forEach(gr=>{
   if(pillars.includes(gr.id)){
     const idx=gr.rows.findIndex(r=>r.filter(x=>x).length<=1&&DEPBAND.test(r.find(x=>x)||""));
     if(idx>=0){tabs.push({id:gr.id,short:gr.short,title:gr.title,rows:gr.rows.slice(0,idx)});dep.push({pillar:gr.short,rows:gr.rows.slice(idx)});}
     else tabs.push({id:gr.id,short:gr.short,title:gr.title,rows:gr.rows});
   }else tabs.push({id:gr.id,short:gr.short,title:gr.title,rows:gr.rows});});
 const qref=`<div class="card"><div class="ct">Quick reference — lead lever &amp; expected return by band ${R==="SG"?'<span class="basis">MY read — SG validation required</span>':''}</div><div class="tblwrap"><table class="d"><thead><tr><th class="stick">Band</th><th>Lead lever</th><th>Also</th><th class="n">Return / ${sym()}1 <span style="font-weight:400;text-transform:none">(NGR; giveaways = dep)</span></th></tr></thead><tbody>${c.map(r=>`<tr><td class="stick"><span class="dot" style="background:var(--band-${r[0].toLowerCase()})"></span>${r[0]}</td><td style="white-space:normal">${esc(r[1])}</td><td class="mut" style="white-space:normal">${esc(r[2])}</td><td class="n">${esc(r[3])}</td></tr>`).join("")}</tbody></table></div></div>`;
 const depCard=dep.length?`<div class="card"><div class="ct">Deposit-band ladders — what to give each value band (by pillar)</div><div class="tblwrap"><table class="d cfg"><tbody>${dep.map(p=>`<tr><td colspan="7" class="cfgband">${esc(p.pillar)} — by deposit band</td></tr>`+p.rows.filter(r=>!(r.filter(x=>x).length<=1&&DEPBAND.test(r.find(x=>x)||""))).map(rowHTML).join("")).join("")}</tbody></table></div><div class="foot">${R==="SG"?"SG band ladders directional (MY read).":"MY-measured, directional — confirm with a holdout."} Cashback = lever to <b>pilot</b>.</div></div>`:"";
 if(!tabs.find(t=>t.id===CT))CT=tabs[0]?tabs[0].id:"";
 const curT=tabs.find(t=>t.id===CT)||tabs[0];
 const sw=`<div class="winsw" id="cfgsw" style="flex-wrap:wrap;margin:12px 0 4px">${tabs.map(t=>`<button data-c="${t.id}" class="${t.id===CT?'on':''}">${esc(t.short)}</button>`).join("")}</div>`;
 const secCard=curT?`<div class="card"><div class="ct" style="font-size:13px;font-weight:700;color:var(--ink)">${esc(curT.title)}</div><div class="tblwrap"><table class="d cfg"><tbody>${curT.rows.map(rowHTML).join("")}</tbody></table></div></div>`:"";
 g("panel").innerHTML=takeBox([`Deposit-match NGR-return climbs with band (+0.8 → +2.4 per ${sym()}1); giveaways show the highest deposits-per-${sym()}1 at Mid (1.08 dep/${sym()}1, vs the claimer's own baseline — a holdout is needed to confirm true lift); VIP money pays on whales — cashback is a pilot to test, not a measured result.${R==='SG'?' Figures are the MY read — SG validation required.':''}`,`Quick reference &amp; deposit-band ladders below; switch between each pillar's tier ladders, game details and eligible games with the tabs.`,`Directional own-baseline — confirm a new config with a holdout. ${R==="SG"?"On SG the money &amp; codes tabs are the SG book, but these quick-reference returns, band ladders and cashback figures are the MY read — SG validation required.":""}`])+qref+depCard+sw+secCard;

function tRef(){
 const forms=d().formulas||[],calls=(d().callsLevers||[]).filter(r=>String(r[0]).toLowerCase()!=="trim");
 const HDR=/^(Metric|The call|Call|Formula|What it means|Worked example|Action|Specific lever)/;
 const rowHTML=(r,nc)=>{const filled=r.filter(x=>x).length;
   if(filled<=1)return `<tr><td colspan="${nc}" class="cfgband">${esc(r.find(x=>x)||"")}</td></tr>`;
   const ish=r.some(x=>HDR.test(x));
   return `<tr class="${ish?'cfghd':''}">${r.map((x,i)=>`<td${i===0?' class="cfgk"':''} style="white-space:normal">${x?esc(x):''}</td>`).join("")}</tr>`;};
 const callsTbl=calls.length?`<div class="card"><div class="ct">Calls &amp; levers — what each verdict means and its action</div><div class="tblwrap"><table class="d cfg"><tbody>${calls.map(r=>rowHTML(r,4)).join("")}</tbody></table></div></div>`:"";
 const formTbl=forms.length?`<div class="card"><div class="ct">Formulas — how every metric is worked out (facts → economics → costs → behaviour)</div><div class="tblwrap"><table class="d cfg"><tbody>${forms.map(r=>rowHTML(r,4)).join("")}</tbody></table></div></div>`:"";
 const terms=[["Value & segments",[["Deposit band",`Players grouped by deposit value — beats membership tier on stability. Two bases, never combined in one grid: the at-risk / lifecycle view bands on YTD deposit (Top value ≥100k / High ≥20k / Mid ≥2k) and counts distinct YTD-estate members; the config and 'what each band is worth' view bands on 90-day pre-claim deposit (Whale ≥50k / High ≥5k / Mid ≥500) and counts claimers. Same band names, different populations — not directly comparable.`],["Recency state","Active · Cooling 31–60d · Lapsed 61–90d · Dormant 90d+. Cooling + lapsing = pre-churn."],["VIP scope (lanes)","VIP codes sit in 4 lanes; this report shows only the <b>Performance</b> lane (deposit / free-credit rewards scored on Bonus ROI). The other lanes — <b>Cashback</b> (weekly rescue), <b>Engagement</b> (lucky-wheel / check-in / scratch) and <b>Entitlement</b> (birthday / loyalty gifts) — are judged on their own bases (retention-after-loss, house-margin cover, downstream NGR) and are not surfaced here."]]],
   ["Decisions",[["The call",`Scale · Maintain · Optimise · Reduce · Stop — a first-week Bonus-ROI trigger on matured cohorts, NOT a final cut order. Bonus ROI = the LIFT in net NGR versus the player's own 14-day pre-claim daily-average baseline, divided by bonus spend — credit-split across any bonuses running at once and weighted toward the earlier days of the window (see Formulas). It measures IMPROVEMENT versus the player's own baseline run-rate, per unit of bonus — NOT absolute profit: 0 = no change vs baseline, positive = better than baseline, negative = worse. (The pipeline treats NGR as already net of the bonus cost; that data definition has not been independently re-verified against the warehouse.) Scale = strongly positive → size up; Maintain = positive and stable → keep; Optimise = marginal → adjust size/terms; Reduce/Stop = negative → route to the 'Pays back later?' review + a holdout before any cut. Cut only if it does NOT recover by 30/60/90d AND reaches no high-lifetime players — otherwise test, don't cut.`],["Pays back later?","Review flag for losing calls — does the lift recover at 30/60/90d? Green = test before cutting."],["Holdout","A matched untreated control group; the proof step — the ROI here is an estimated change vs baseline, an association, not a proven causal effect."]]],
   ["Levers",[["Cashback",`A loss-rebate; the VIP loyalty lever — here a lever to PILOT, not yet ROI-scored. Where a “+3.0/+3.1” figure appears near cashback it is the observed no-deposit give-back proxy, not a measured cashback result.`],["Deposit-match / reload","Deposit-required bonus; judged on Bonus ROI (net-NGR lift vs baseline, per unit bonus)."],["No-deposit giveaway",`Free credit / spins — a no-deposit cost, so it typically reads negative on Bonus ROI (its short-window net-NGR lift rarely recoups the bonus). That is the wrong lens: judge it on its purpose — reactivation and gross deposits pulled per ${sym()}1 given, measured against the claimer's own pre-claim baseline (true incremental pull needs a holdout), plus the lifetime value of the players it reaches. Short-run ROI and long-run value can point opposite ways.`]]]];
 const termsTbl=`<div class="card"><div class="ct">Key terms — by category</div><div class="tblwrap"><table class="d cfg"><tbody>${terms.map(([cat,items])=>`<tr><td colspan="2" class="cfgband">${esc(cat)}</td></tr>`+items.map(([k,v])=>`<tr><td class="cfgk" style="white-space:normal;width:190px">${esc(k)}</td><td style="white-space:normal">${esc(v)}</td></tr>`).join("")).join("")}</tbody></table></div></div>`;
 g("panel").innerHTML=takeBox([`Every metric, call and term used across the tabs — defined here.`,`Formulas show what each number is made of, with a worked example, grouped facts → economics → costs → behaviour.`,`Directional own-baseline — a matched holdout is the causal proof step.`])+callsTbl+formTbl+termsTbl;
}
